name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to verify (the release tag)
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Real ruwana integration tests skip unless a binary is provisioned through
      # PISAR_TEST_RUWANA (set PISAR_TEST_REQUIRE_RUWANA=1 to make that mandatory).
      - name: Test from source
        run: python -m unittest discover -s tests -t . -v

      - name: Build the zipapp
        run: python scripts/build-zipapp.py "$RUNNER_TEMP/pisar"

      - name: Test the zipapp outside the checkout
        env:
          PISAR_TEST_EXECUTABLE: ${{ runner.temp }}/pisar
        run: python -m unittest discover -s tests -t .

  scripts:
    name: Check scripts and commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check shell scripts
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-conventional-commits.sh "origin/$BASE_REF..HEAD"
