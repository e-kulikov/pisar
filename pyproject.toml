[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pisar"
version = "0.3.0"
description = "Offline CLI for file-authoritative, Git-backed knowledge repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pisar = "pisar.cli:main"

[tool.setuptools]
packages = ["pisar"]

[tool.setuptools.package-data]
pisar = ["*.md"]
